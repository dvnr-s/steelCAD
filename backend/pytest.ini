[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
# Run the whole suite on a single event loop so the session-scoped async
# engine and the per-function sessions/clients share one loop (pytest-asyncio
# >=1.0 defaults each to a function-scoped loop, which breaks the shared engine).
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
