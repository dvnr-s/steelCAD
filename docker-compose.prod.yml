# SteelCAD — Production Docker Compose
#
# Differences from the dev compose (docker-compose.yml):
#   - No source bind-mounts or --reload; the images are self-contained.
#   - PostgreSQL is NOT published to the host (only reachable on the internal network).
#   - The backend is NOT published directly; nginx (frontend) reverse-proxies to it.
#   - The frontend is served by nginx on port 80.
#   - JWT_SECRET_KEY has no insecure default — it MUST be supplied via the environment/.env.
#
# Usage:
#   JWT_SECRET_KEY=$(openssl rand -hex 32) docker compose -f docker-compose.prod.yml up -d --build

services:
  # ─── PostgreSQL Database ─────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-steelcad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in production}
      POSTGRES_DB: ${POSTGRES_DB:-steelcad}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-steelcad}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Backend API ─────────────────────────────────────
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-steelcad}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-steelcad}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required in production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    # Production: multiple workers, no reload.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4

  # ─── Frontend (nginx + static bundle) ────────────────
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
