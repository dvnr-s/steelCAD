# Nginx config for the SteelCAD frontend container.
# Serves the static SPA and reverse-proxies API routes to the backend service.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip static assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API reverse proxy — forwards to the backend service on the compose network.
    # The "backend" hostname is the service name in docker-compose.prod.yml.
    location ~ ^/(auth|designs|estimates|rates|health) {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # SPA fallback — all other routes resolve to index.html for client routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
