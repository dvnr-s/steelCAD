# Nginx config for the SteelCAD frontend container.
# Serves the static SPA and reverse-proxies API routes to the backend service.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip static assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API reverse proxy — forwards to the backend service on the compose network.
    # The "backend" hostname is the service name in docker-compose.prod.yml.
    # Must list every backend router prefix (see app.main routers) plus the
    # health/readiness probes and the top-level /price preview endpoint.
    location ~ ^/(auth|users|designs|customers|estimates|rates|settings|audit|trash|dashboard|price|health|ready) {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # SPA fallback — all other routes resolve to index.html for client routing.
    # Security headers are set here for the static bundle; API responses get
    # the same set from the backend's security-headers middleware. "always"
    # keeps them on error responses (404 fallback, 50x) too.
    location / {
        try_files $uri $uri/ /index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # Scripts only from our own origin. 'unsafe-inline' styles are required
        # by the SPA's inline style attributes; no external hosts are allowed.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    }
}
