# Nginx config for the SteelCAD frontend container.
# Serves the static SPA and reverse-proxies API routes to the backend service.

# The SPA (BrowserRouter) and the API share path prefixes — /customers is both
# a page and a JSON endpoint. Browser navigations (bookmark, refresh, typed
# URL) send "Accept: text/html"; API/XHR calls from the app send JSON/blob
# Accept headers. This map lets the proxy location below hand document
# requests back to the SPA instead of returning raw API JSON.
map $http_accept $steelcad_wants_html {
    default 0;
    ~text/html 1;
}

# Real client IP recovery when something else terminates TLS in front of us.
#
# The backend rate-limits per `X-Real-IP` (services/ratelimit.py), which the
# proxy block below sets to $remote_addr. Connected to directly, $remote_addr IS
# the client — correct. But put a host-level Caddy/nginx or a load balancer in
# front (docs/DEPLOY.md §7) and $remote_addr becomes THAT proxy's address for
# every request, so all callers collapse into a single rate-limit bucket and one
# actor can exhaust the login limit for everyone.
#
# These directives re-derive the client address from X-Forwarded-For, but only
# when the connection comes from a private range — i.e. our own front proxy on
# the Docker/host network. A direct caller from the public internet has a public
# $remote_addr, is therefore not a trusted hop, and cannot spoof its identity by
# sending X-Forwarded-For itself.
#
# Caveat: if you expose this container directly to an untrusted *private* network
# (an office LAN rather than a public VPS), a peer on that LAN would be treated
# as a trusted hop. Narrow these to your proxy's exact address if so.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.0/8;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip static assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API reverse proxy — forwards to the backend service on the compose network.
    # The "backend" hostname is the service name in docker-compose.prod.yml.
    # Must list every backend router prefix (see app.main routers) plus the
    # health/readiness probes and the top-level /price preview endpoint. The
    # (/|$) anchor stops lookalike paths (e.g. /customers-foo) from matching.
    location ~ ^/(auth|users|designs|customers|estimates|rates|settings|audit|trash|dashboard|price|health|ready)(/|$) {
        # Browser page loads on shared paths get the SPA, not API JSON.
        if ($steelcad_wants_html) {
            rewrite ^ /index.html last;
        }
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # SPA fallback — all other routes resolve to index.html for client routing.
    # Security headers are set here for the static bundle; in production the
    # backend's security-headers middleware sends the equivalent set (same
    # CSP) on API responses. "always" keeps them on error responses too.
    location / {
        try_files $uri $uri/ /index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # Scripts only from our own origin. 'unsafe-inline' styles are required
        # by the SPA's inline style attributes; no external hosts are allowed.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    }
}
