# SteelCAD — Render Blueprint (Dashboard → New → Blueprint → pick this repo).
#
# One web service (nginx + API in one container, Dockerfile.render). The
# database is Neon (project muddy-wind-41258186, aws-ap-southeast-1 — same
# region as this service), not Render Postgres, whose free tier expires after
# 30 days. Singapore is Render's closest region to India.
#
# Free-tier caveat: the web service sleeps after 15 min idle (~1 min cold start).

services:
  - type: web
    name: steelcad
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /ready
    envVars:
      - key: APP_ENV
        value: production
      # Neon's DIRECT (non -pooler) URL, pasted in the dashboard:
      #   neon connection-string production --project-id muddy-wind-41258186
      # Direct, not pooled: this is a long-running server with its own pool, and
      # asyncpg's prepared statements break under PgBouncer transaction mode.
      # start.sh strips ?sslmode=… (asyncpg rejects it) and enables TLS.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"                  # Neon is reached over the internet
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: ""                      # same-origin behind nginx
      - key: WEB_CONCURRENCY
        value: "1"                     # 512 MB instance; rate limits are per-process
      # First admin, created once on first boot by deploy/render/first_run.py.
      # The email is asked for when the Blueprint is created; the password is
      # generated — read it from the service's Environment tab, then change it
      # in the app.
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        generateValue: true
