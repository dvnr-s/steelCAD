# SteelCAD — Render Blueprint (Dashboard → New → Blueprint → pick this repo).
#
# One web service (nginx + API in one container, Dockerfile.render) plus a
# managed Postgres. Singapore is Render's closest region to India.
#
# Free-tier caveats: the web service sleeps after 15 min idle (~1 min cold
# start), and a free Postgres database EXPIRES 30 days after creation — upgrade
# the database plan before then or the data is deleted.

databases:
  - name: steelcad-db
    plan: free
    region: singapore
    databaseName: steelcad
    user: steelcad
    postgresMajorVersion: "16"
    ipAllowList: []   # no public access — only Render services in this region

services:
  - type: web
    name: steelcad
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /ready
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: steelcad-db
          property: connectionString   # internal URL, private network
      - key: DATABASE_SSL
        value: "false"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: ""                      # same-origin behind nginx
      - key: WEB_CONCURRENCY
        value: "1"                     # 512 MB instance; rate limits are per-process
      # First admin, created once on first boot by deploy/render/first_run.py.
      # The email is asked for when the Blueprint is created; the password is
      # generated — read it from the service's Environment tab, then change it
      # in the app.
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        generateValue: true
