name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Backend ──────────────────────────────────────────────────────
  backend:
    name: Backend — lint & test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: steelcad
          POSTGRES_PASSWORD: steelcad
          POSTGRES_DB: steelcad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      - name: Lint (ruff)
        run: ruff check app/ tests/

      - name: Run tests (pricing unit + API integration)
        env:
          APP_ENV: development
          DATABASE_URL: postgresql+asyncpg://steelcad:steelcad@localhost:5432/steelcad_test
          TEST_DATABASE_URL: postgresql+asyncpg://steelcad:steelcad@localhost:5432/steelcad_test
          JWT_SECRET_KEY: ci-test-secret-not-for-production
        run: python -m pytest tests/ -v --tb=short

      - name: Dependency audit
        run: pip install pip-audit && pip-audit -r requirements.txt --ignore-vuln GHSA-w596-4wvx-j9j6
        continue-on-error: true

  # ── Frontend ─────────────────────────────────────────────────────
  frontend:
    name: Frontend — lint, test & build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm test

      - name: Build
        run: npm run build

      - name: Dependency audit
        run: npm audit --production
        continue-on-error: true
